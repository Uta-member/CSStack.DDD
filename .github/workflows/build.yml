name: Build

# master へのプッシュとプルリクエストで、ビルド、テスト、パックが通ることを確認する。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build CSStack.DDD.slnx -c Release

      - name: Test
        run: dotnet test --solution CSStack.DDD.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/CSStack.DDD/CSStack.DDD.csproj -c Release --no-build -o artifacts
