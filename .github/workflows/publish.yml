name: Publish to NuGet

# GitHub でリリースを公開したときに実行する。
# バージョンはリリースのタグ（v1.2.3 または 1.2.3）から取る。
on:
  release:
    types: [published]

permissions:
  contents: write  # リリースへの .nupkg の添付
  id-token: write  # NuGet Trusted Publishing（OIDC）

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Get version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid version. Use v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build CSStack.DDD.slnx -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --solution CSStack.DDD.slnx -c Release --no-build -p:Version=${{ steps.version.outputs.version }}

      - name: Pack
        run: dotnet pack src/CSStack.DDD/CSStack.DDD.csproj -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.nupkg artifacts/*.snupkg --clobber
